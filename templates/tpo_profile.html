{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent">
                    <h4><i class="fas fa-user"></i> TPO Profile</h4>
                </div>
                <div class="card-body">
                    <p><strong>Name:</strong> {{ tpo.full_name }}</p>
                    <p><strong>User ID:</strong> {{ tpo.user_id }}</p>
                    <p><strong>Email:</strong> {{ tpo.email }}</p>
                    <p><strong>Phone:</strong> {{ tpo.phone }}</p>
                    <p><strong>Department:</strong> {{ tpo.department|default:"-" }}</p>
                    <a href="#" class="btn btn-sm" style="background:#004d40; color:white;">
                        <i class="fas fa-edit"></i> Edit Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
