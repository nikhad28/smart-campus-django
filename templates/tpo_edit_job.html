{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-transparent">
                    <h4><i class="fas fa-edit"></i> Edit Job Vacancy</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Company *</label>
                            <select name="company_id" class="form-select" required>
                                <option value="">Select Company</option>
                                {% for company in companies %}
                                <option value="{{ company.id }}" {% if company.id == job.company_id %}selected{% endif %}>
                                    {{ company.company_name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Job Title *</label>
                            <input type="text" name="job_title" class="form-control" value="{{ job.job_title }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Job Description *</label>
                            <textarea name="job_description" class="form-control" rows="4" required>{{ job.job_description }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Application Link *</label>
                            <input type="url" name="application_link" class="form-control" value="{{ job.application_link }}" required>
                            <small class="text-muted">Students will be redirected to this link to apply</small>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Location</label>
                                    <input type="text" name="location" class="form-control" value="{{ job.location|default:'' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Salary Range</label>
                                    <input type="text" name="salary_range" class="form-control" value="{{ job.salary_range|default:'' }}">
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Experience Required</label>
                                    <input type="text" name="experience_required" class="form-control" value="{{ job.experience_required|default:'' }}">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Application Deadline</label>
                                    <input type="date" name="application_deadline" class="form-control" value="{{ job.application_deadline|default:'' }}">
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Eligibility Criteria</label>
                            <textarea name="eligibility_criteria" class="form-control" rows="2">{{ job.eligibility_criteria|default:'' }}</textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" name="is_active" class="form-check-input" {% if job.is_active %}checked{% endif %}>
                            <label class="form-check-label fw-bold">Active</label>
                        </div>
                        <button type="submit" class="btn" style="background:#004d40; color:white; padding:10px 30px;">
                            <i class="fas fa-save"></i> Update Job
                        </button>
                        <a href="{% url 'tpo_manage_jobs' %}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
