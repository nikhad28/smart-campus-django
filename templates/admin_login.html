<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - AIKTC Campus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CSS VARIABLES
           ============================================ */
        :root {
            --green-primary: #004d40;
            --green-light: #00695c;
            --green-dark: #00332a;
            --green-gold: #ffd93d;
            --white: #ffffff;
            --cream: #f5f0eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============================================
           LOGIN CONTAINER
           ============================================ */
        .login-wrapper {
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.08);
            max-width: 440px;
            width: 100%;
            padding: 44px 36px 36px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 77, 64, 0.06);
        }

        /* ===== TOP GREEN BAR ===== */
        .login-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #004d40, #00897b, #004d40);
        }

        /* ===== LOGO ===== */
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #004d40, #00897b);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 2rem;
            color: white;
            box-shadow: 0 8px 30px rgba(0, 77, 64, 0.15);
        }

        .login-logo h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #00332a;
            letter-spacing: -0.5px;
        }

        .login-logo h2 span {
            color: #004d40;
        }

        .login-logo p {
            color: #6c6c8a;
            font-size: 0.9rem;
            margin: 4px 0 0;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #00332a;
            display: block;
            margin-bottom: 6px;
        }

        .form-group label i {
            color: #004d40;
            margin-right: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8e0d8;
            border-radius: 14px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #fcf9f7;
            color: #1a1a2e;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            outline: none;
            border-color: #004d40;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 77, 64, 0.06);
        }

        .form-group input::placeholder {
            color: #b0a8a0;
        }

        /* ===== LOGIN BUTTON ===== */
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #004d40, #00695c);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 77, 64, 0.25);
        }

        /* ===== BACK LINK ===== */
        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #6c6c8a;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: #004d40;
        }

        /* ===== MESSAGES ===== */
        .alert {
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.9rem;
            border: none;
            margin-bottom: 16px;
        }

        .alert-success {
            background: rgba(0, 77, 64, 0.06);
            color: #004d40;
            border-left: 4px solid #004d40;
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.06);
            color: #a93226;
            border-left: 4px solid #dc3545;
        }

        .alert-info {
            background: rgba(23, 162, 184, 0.06);
            color: #0d47a1;
            border-left: 4px solid #17a2b8;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 480px) {
            .login-wrapper {
                padding: 32px 20px 28px;
            }
            .login-logo .icon {
                width: 60px;
                height: 60px;
                font-size: 1.6rem;
            }
            .login-logo h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Logo -->
        <div class="login-logo">
            <div class="icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Admin <span>Login</span></h2>
            <p>AIKTC Smart Campus</p>
        </div>

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-circle{% else %}info-circle{% endif %} me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <!-- Back Link -->
        <div class="back-link">
            <a href="{% url 'index' %}">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
